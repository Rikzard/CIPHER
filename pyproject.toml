[project]
name = "cipher"
version = "0.1.0"
description = "Defense-in-depth prompt injection detection gateway"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.141.1",
    "faiss-cpu==1.15.1",
    "pydantic==2.13.5",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers==6.1.0",
]
classifier = [
    "transformers==5.18.0",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyarrow>=25.0.1",
    "uvicorn==0.54.0",
]
classifier-train = [
    "transformers==5.18.0",
    "torch==2.14.1",
]

[tool.uv]
package = false
